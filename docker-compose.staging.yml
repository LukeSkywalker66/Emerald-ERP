services:
  # 1. Base de Datos
  db:
    image: postgres:15-alpine
    container_name: emerald_db_staging
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  # 2. Backend
  backend:
    build: ./backend
    container_name: emerald_backend_staging
    restart: always
    ports:
      - "5679:5678"
      - "8501:8500"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: America/Argentina/Buenos_Aires
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    env_file:
      - .env

  # 3. Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emerald_frontend_staging
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_APP_ENV=${APP_ENV}
      - VITE_API_URL=${VITE_API_URL:-/api}
      - INTERNAL_API_URL=http://backend:8500
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  # 4. Nginx (El Policía de Tránsito Interno)
  nginx:
    image: nginx:alpine
    container_name: emerald_nginx_staging
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/login-test.html:/etc/nginx/login-test.html
    depends_on:
      - frontend
      - backend
    networks:
      - default
      - emerald_gateway

  # 5. El Frontend de Beholder
  beholder:
    build: 
      context: ./beholder_frontend
      dockerfile: Dockerfile
    container_name: emerald_beholder_staging
    restart: always
    environment:
      - VITE_API_URL=${BEHOLDER_API_URL:-/api}
      - VITE_API_KEY=${BEHOLDER_API_KEY} 
    volumes:
      - ./beholder_frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # 7. MINIO (Almacenamiento de Objetos Local)
  minio:
    image: minio/minio
    container_name: emerald_minio_staging
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9004:9000"
      - "127.0.0.1:9005:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data_staging:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. CELERY + REDIS
  redis:
    image: redis:alpine
    container_name: emerald_redis_staging
    restart: always
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build: ./backend
    container_name: emerald_worker_staging
    restart: always
    command: celery -A src.celery_app worker --beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TZ=America/Argentina/Buenos_Aires
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      backend:
        condition: service_started

networks:
  default:
  emerald_gateway:
    external: true

volumes:
  postgres_data_staging:
  minio_data_staging:
