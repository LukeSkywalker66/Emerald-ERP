

# QA E2E Playwright sectorizado: SOLO el servicio de test, sin duplicar backend/db/frontend
version: '3.9'

services:
  e2e:
    build:
      # Esto apunta directo a /opt/emerald-erp/frontend/tests
      context: ${PWD}/frontend/tests
      
      # Y como el contexto es esa carpeta exacta, el archivo está ahí:
      dockerfile: e2e.Dockerfile
    container_name: emerald_e2e
    environment:
      - BASE_URL=http://frontend:5173
    networks:
      - emerald-erp_default
    ipc: host
    command: ["npx", "playwright", "test", "--reporter=list"]
    profiles:
      - qa
      - test

networks:
  emerald-erp_default:
    external: true
