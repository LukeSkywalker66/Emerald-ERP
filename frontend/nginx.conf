server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GZIP estricto (nivel 6: balance CPU vs tamaño de transferencia)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript;

    # Estáticos con hash de Vite → cache largo e immutable
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html sin caché (descubre los hashes nuevos de los bundles)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: recarga directa (F5) en rutas profundas
    location / {
        try_files $uri $uri/ /index.html;
    }
}
