<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <filter id="glow-stag" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Chasis Zinc-900 -->
    <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#18181b" stroke="#b45309" stroke-width="2"/>
    <!-- Núcleo Holográfico -->
    <polygon points="50,22 72,35 72,65 50,78 28,65 28,35" fill="none" stroke="#fbbf24" stroke-width="3" filter="url(#glow-stag)"/>
    <!-- Nodo Central -->
    <circle cx="50" cy="50" r="8" fill="#f59e0b" filter="url(#glow-stag)"/>
    <!-- Líneas de Transmisión -->
    <path d="M50,5 L50,22 M10,27.5 L28,35 M90,27.5 L72,35 M10,72.5 L28,65 M90,72.5 L72,65 M50,95 L50,78" stroke="#b45309" stroke-width="2"/>
</svg>
