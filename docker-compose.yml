
services:
  # 1. Base de Datos
  db:
    image: postgres:15-alpine
    container_name: emerald_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s      # Preguntar cada 5 segundos
      timeout: 5s       # Si tarda más de 5s en responder, falló
      retries: 5        # Intentar 5 veces antes de rendirse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # Solo accesible por túnel SSH

  # 2. Backend
  backend:
    build: ./backend
    container_name: emerald_backend
    restart: always
    # 🔥 PRODUCCIÓN: 4 workers, sin --reload (evita bucle watchfiles + Nginx 502)
    command: uvicorn src.main:app --host 0.0.0.0 --port 8500 --workers 4
    ports:
      - "8500:8500"  # <--- (API Backend)
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: America/Argentina/Buenos_Aires  # Sincronizar logs con hora local
    depends_on:
      db:
        condition: service_healthy  # <--- LA CLAVE MÁGICA
    volumes:
      - ./backend:/app
    env_file:
      - .env

  # 3. Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emerald_frontend
    restart: always
    # YA NO TIENE "ports".
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Inyecta VITE_APP_ENV desde el .env general (APP_ENV=development|staging|production)
      - VITE_APP_ENV=${APP_ENV}
      # CAMBIO: Ahora sí lee del archivo .env
      # Si no encuentra la variable, usa '/api' por defecto.
      - VITE_API_URL=${VITE_API_URL:-/api}
      - INTERNAL_API_URL=http://backend:8500
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  # 4. Nginx (El Policía de Tránsito Interno)
  nginx:
    image: nginx:alpine
    container_name: emerald_nginx # OJO: en staging será _staging y prod será _prod
    restart: unless-stopped
    # 🔴 YA NO HAY PORTS! No expone nada al host.
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/login-test.html:/etc/nginx/login-test.html
      # 🔴 YA NO HAY VOLÚMENES DE CERTBOT
    depends_on:
      - frontend
      - backend
    networks:
      - default
      - emerald_gateway # Se conecta al túnel secreto con el Bouncer

  # 🔴 EL SERVICIO CERTBOT FUE ELIMINADO POR COMPLETO DE ESTE ARCHIVO


  # 5. El Frontend de Beholder (Viejo pero confiable)
  # Nuevo Servicio: Beholder UI
  beholder:
    build: 
      context: ./beholder_frontend
      dockerfile: Dockerfile
    container_name: emerald_beholder
    restart: always
    environment:
      # ACÁ OCURRE LA MAGIA DE INTEGRACIÓN:
      # Le decimos: "Tu API ya no es la 138...:8500. Tu API es /api (el backend nuevo)"
      - VITE_API_URL=${BEHOLDER_API_URL:-/api}
      # Si necesitás la API KEY, la pasás desde el .env principal
      - VITE_API_KEY=${BEHOLDER_API_KEY} 
    volumes:
      - ./beholder_frontend:/app
      - /app/node_modules
    depends_on:
      - backend

# 6. CELERY + REDIS (El Obrero Nocturno)
  # 1. REDIS (El mensajero)
  redis:
    image: redis:alpine
    container_name: emerald_redis
    restart: always
    command: redis-server --appendonly yes
    # 🔒 SEGURIDAD: Solo accesible desde localhost (o tunel SSH), no desde internet
    ports:
      - "127.0.0.1:6379:6379"
    # 🏥 SALUD: Permite que otros servicios sepan cuando Redis está listo de verdad
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  # 2. WORKER + BEAT (El obrero que trabaja de noche)
  celery_worker:
    build: ./backend
    container_name: emerald_worker
    restart: always
    command: celery -A src.celery_app worker --beat --loglevel=info
    volumes:
      - ./backend:/app
      - ./data/backups:/app/data/backups
      - ${HOME}/.config/rclone:/root/.config/rclone:ro
      - ${HOME}/.ssh:/root/.ssh:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      # 🚦 SEMÁFORO: No arranca hasta que los otros estén en verde (healthy)
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      backend:
        condition: service_started
# 7. MINIO (Almacenamiento de Objetos Local)
  minio:
    image: minio/minio
    container_name: emerald_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
  emerald_gateway:
    external: true

volumes:
  postgres_data:
  redis_data:
  minio_data: