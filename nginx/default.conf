server {
    listen 80;
    # Atiende cualquier dominio que le mande el Bouncer
    server_name _;
    client_max_body_size 20m;

    # --- RUTAS ---
    
    location = /login-test {
        alias /etc/nginx/login-test.html;
        default_type text/html;
    }
    
    # Frontend (Emerald)
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Monitor (Beholder)
    location /monitor/ {
        proxy_pass http://beholder:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Pasamos el protocolo original que nos mandó el Bouncer (https)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; 

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Media (Archivos adjuntos)
    location /media/ {
        proxy_pass http://backend:8500/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8500/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # FastAPI Docs (Swagger UI)
    location /docs {
        proxy_pass http://backend:8500/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # FastAPI ReDoc
    location /redoc {
        proxy_pass http://backend:8500/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # OpenAPI JSON
    location /openapi.json {
        proxy_pass http://backend:8500/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}