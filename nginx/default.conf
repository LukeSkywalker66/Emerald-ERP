server {
    listen 80;
    # Atiende cualquier dominio que le mande el Bouncer
    server_name _;
    client_max_body_size 20m;

    # Resolvedor DNS dinámico para Docker (evita cacheo obsoleto de IPs).
    # Los contenedores pueden cambiar de IP al reiniciarse. Al apuntar
    # proxy_pass a VARIABLES (no a hostnames estáticos), nginx re-resuelve
    # el nombre vía DNS de Docker cada `valid` segundos y levanta la IP
    # nueva SIN necesidad de reiniciar el contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstreams dinámicos (se resuelven en cada request)
    set $frontend_upstream http://frontend:80;
    set $beholder_upstream http://beholder:5173;
    set $backend_upstream  http://backend:8500;

    # --- RUTAS ---

    location = /login-test {
        alias /etc/nginx/login-test.html;
        default_type text/html;
    }

    # Frontend (Emerald)
    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Monitor (Beholder)
    location /monitor/ {
        proxy_pass $beholder_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Pasamos el protocolo original que nos mandó el Bouncer (https)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # === NOTA: Este archivo es COMPARTIDO por los 3 entornos ===
    # Se monta en: emerald_nginx (prod), emerald_nginx_staging, emerald_nginx_dev
    # Los service names (frontend, beholder, backend) se resuelven
    # dentro de la red Docker interna de cada stack.

    # Media (Archivos adjuntos)
    location /media/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Backend API
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # FastAPI Docs (Swagger UI)
    location /docs {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # FastAPI ReDoc
    location /redoc {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # OpenAPI JSON
    location /openapi.json {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
