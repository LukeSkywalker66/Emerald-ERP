name: Deploy Production

on:
  push:
    branches:
      - master

# Un merge a master YA dispara el evento `push`. El trigger `pull_request` era
# redundante y provocaba DOS runs simultáneos del deploy. Lo eliminamos y, además,
# cancel-in-progress=false hace que los deploys se ENCOLEN en vez de cancelarse
# a mitad de camino (causa raíz del deploy a medias que rompió producción).
concurrency:
  group: deploy-production-master
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/emerald-erp

            git fetch origin master
            git reset --hard origin/master

            docker compose -f docker-compose.yml build
            docker compose -f docker-compose.yml up -d
            docker compose -f docker-compose.yml exec -T backend alembic upgrade head
            # `restart` (no `reload`) para forzar a nginx a re-resolver la IP del
            # contenedor frontend recreado (evita el 502 por DNS stale).
            docker compose -f docker-compose.yml restart nginx

      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: false
          script: |
            set -euo pipefail
            cd /opt/emerald-erp
            docker compose -f docker-compose.yml ps
            docker compose -f docker-compose.yml logs --tail=50 backend
            docker compose -f docker-compose.yml exec -T nginx nginx -s reload