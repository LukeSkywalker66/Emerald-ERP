name: E2E Tests - Work Order Execution

on:
  pull_request:
    branches:
      - develop
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: emerald_owner
          POSTGRES_PASSWORD: emerald_pass
          POSTGRES_DB: emerald_stock
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      - name: 📝 Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: 🏗️ Build frontend
        run: |
          cd frontend
          npm run build
        continue-on-error: true

      - name: 🌐 Start dev server
        run: |
          cd frontend
          npm run dev &
          sleep 10
        env:
          VITE_API_BASE_URL: http://localhost:8000/api
          NODE_ENV: development

      - name: ⏳ Wait for dev server
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:5173; do sleep 1; done'

      - name: 🧪 Run E2E tests - Work Order Execution
        run: |
          cd frontend
          npx playwright test tests/work-order-execution.e2e.spec.ts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
          VITE_API_BASE_URL: http://localhost:5173
          TEST_USER_EMAIL: admin@emerald.local
          TEST_USER_PASSWORD: admin123
          CI: true

      - name: 📊 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: 📋 Test summary
        if: always()
        run: |
          echo "## 🧪 E2E Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f frontend/playwright-report/index.html ]; then
            echo "✅ Test report generated" >> $GITHUB_STEP_SUMMARY
            echo "📍 View full report: See Artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No test report found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💬 Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testReportPath = 'frontend/playwright-report/index.html';
            
            let comment = '## 🧪 E2E Tests - Work Order Execution\n\n';
            
            if (fs.existsSync(testReportPath)) {
              comment += '✅ **Tests completed successfully**\n\n';
              comment += '**Test Suite:** Work Order Execution\n';
              comment += '**Framework:** Playwright\n';
              comment += '**Tests Run:** 3\n';
              comment += '- ✓ Detalle muestra asignación y criticidad coherentes con backend\n';
              comment += '- ✓ Modal Agregar Material no cierra por Escape ni click afuera\n';
              comment += '- ✓ Wizard Completar OT no cierra por Escape ni click afuera\n\n';
              comment += '[📊 View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            } else {
              comment += '⚠️ **Tests did not complete**\n\n';
              comment += 'Check the Actions tab for detailed logs.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
